<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050711">
  <title>TRUE WALK - Referral</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #050711;
      --bg2: #080b18;

      --blue: #38bdf8;
      --blue2: #2563eb;
      --purple: #8b5cf6;
      --pink: #ec4899;
      --orange: #ff8a00;

      --white: #ffffff;
      --text: #eef2ff;
      --muted: #8d96ae;

      --green: #35e89a;
      --red: #ff5f6d;

      --glass: rgba(13, 17, 34, .72);
      --glass2: rgba(18, 23, 45, .84);
      --border: rgba(255,255,255,.09);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 10% 0%,
          rgba(56,189,248,.14),
          transparent 28%
        ),
        radial-gradient(
          circle at 95% 12%,
          rgba(139,92,246,.17),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(236,72,153,.08),
          transparent 35%
        ),
        linear-gradient(
          145deg,
          #03040a,
          #080b18 48%,
          #04050c
        );
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -2;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(100px);
      opacity: .16;
      animation: floatingOrb 13s ease-in-out infinite alternate;
    }

    body::before {
      top: 80px;
      left: -190px;
      background: #2563eb;
    }

    body::after {
      right: -190px;
      bottom: 40px;
      background: #a855f7;
      animation-delay: -5s;
    }

    @keyframes floatingOrb {
      from {
        transform: translate3d(0,0,0) scale(1);
      }

      to {
        transform: translate3d(55px,40px,0) scale(1.12);
      }
    }

    /* Ambient grid */

    body {
      position: relative;
    }

    body > * {
      position: relative;
    }

    body::selection {
      background: rgba(56,189,248,.25);
    }

    /* TOP BAR */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;

      height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 18px;

      background:
        linear-gradient(
          180deg,
          rgba(5,7,17,.94),
          rgba(5,7,17,.72)
        );

      border-bottom: 1px solid rgba(255,255,255,.07);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .topbar::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(56,189,248,.55),
          rgba(139,92,246,.55),
          transparent
        );

      opacity: .55;
    }

    .back {
      width: 43px;
      height: 43px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #fff;
      text-decoration: none;

      font-size: 24px;
      line-height: 1;

      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.08),
          rgba(255,255,255,.025)
        );

      border: 1px solid rgba(255,255,255,.09);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 8px 25px rgba(0,0,0,.2);

      transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;
    }

    .back:hover {
      transform: translateX(-4px);

      border-color: rgba(56,189,248,.4);

      background:
        rgba(56,189,248,.09);

      box-shadow:
        0 0 25px rgba(56,189,248,.12);
    }

    .back:active {
      transform: scale(.94);
    }

    /* BRAND */

    .brand {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);

      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand img {
      width: 38px;
      height: 38px;

      object-fit: contain;
      border-radius: 50%;

      filter:
        drop-shadow(0 0 8px rgba(56,189,248,.25))
        drop-shadow(0 0 18px rgba(139,92,246,.16));

      animation:
        logoFloat 4s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%,100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-3px) rotate(2deg);
      }
    }

    .brand span {
      font-size: 13px;
      font-weight: 950;
      letter-spacing: 1.8px;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          #38bdf8,
          #8b5cf6,
          #ec4899,
          #ffffff
        );

      background-size: 300% auto;

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      animation:
        brandShine 6s linear infinite;
    }

    @keyframes brandShine {
      to {
        background-position: 300% center;
      }
    }

    .top-space {
      width: 43px;
    }

    /* MAIN */

    .container {
      width: min(100% - 24px, 680px);
      margin: auto;
      padding: 28px 0 55px;
    }

    /* HERO */

    .hero {
      position: relative;
      text-align: center;
      margin-bottom: 24px;

      animation:
        fadeUp .7s cubic-bezier(.2,.8,.2,1) both;
    }

    .hero::before {
      content: "";
      position: absolute;

      width: 170px;
      height: 80px;

      left: 50%;
      top: 25px;

      transform: translateX(-50%);

      background:
        linear-gradient(
          90deg,
          #38bdf8,
          #8b5cf6,
          #ec4899
        );

      filter: blur(60px);
      opacity: .14;

      pointer-events: none;
    }

    .hero-badge {
      position: relative;

      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 8px 13px;
      margin-bottom: 14px;

      border-radius: 999px;

      color: #a9ddff;

      background:
        linear-gradient(
          135deg,
          rgba(56,189,248,.11),
          rgba(139,92,246,.09)
        );

      border:
        1px solid rgba(56,189,248,.2);

      box-shadow:
        0 0 25px rgba(56,189,248,.05),
        inset 0 1px 0 rgba(255,255,255,.05);

      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1.1px;
      text-transform: uppercase;
    }

    .hero-badge::before {
      content: "";

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #38bdf8;

      box-shadow:
        0 0 8px #38bdf8,
        0 0 18px rgba(56,189,248,.65);

      animation: pulseDot 2s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%,100% {
        transform: scale(1);
        opacity: .8;
      }

      50% {
        transform: scale(1.45);
        opacity: 1;
      }
    }

    .hero h1 {
      position: relative;

      font-size: clamp(32px, 8vw, 46px);
      line-height: 1;

      letter-spacing: -1.9px;
      font-weight: 950;
    }

    .hero h1 span {
      background:
        linear-gradient(
          90deg,
          #38bdf8,
          #8b5cf6 48%,
          #ec4899
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .hero p {
      position: relative;

      max-width: 480px;

      margin: 11px auto 0;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.6;
    }

    /* CARDS */

    .card {
      position: relative;
      overflow: hidden;

      margin-bottom: 16px;
      padding: 21px;

      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(20,25,47,.82),
          rgba(9,12,25,.78)
        );

      border:
        1px solid var(--border);

      box-shadow:
        0 22px 65px rgba(0,0,0,.32),
        inset 0 1px 0 rgba(255,255,255,.045);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      animation:
        fadeUp .75s cubic-bezier(.2,.8,.2,1) both;
    }

    .card::before {
      content: "";

      position: absolute;

      width: 190px;
      height: 190px;

      top: -130px;
      right: -100px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          rgba(56,189,248,.2),
          rgba(139,92,246,.08)
        );

      filter: blur(35px);

      pointer-events: none;
    }

    .card::after {
      content: "";

      position: absolute;

      left: 0;
      right: 0;
      top: 0;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(56,189,248,.22),
          rgba(139,92,246,.22),
          transparent
        );

      opacity: .7;
    }

    .card:nth-child(2) {
      animation-delay: .08s;
    }

    .title {
      position: relative;
      z-index: 1;

      display: flex;
      align-items: center;
      gap: 11px;

      margin-bottom: 15px;

      font-size: 17px;
      font-weight: 900;
      letter-spacing: -.2px;
    }

    .title-icon {
      width: 39px;
      height: 39px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          rgba(56,189,248,.16),
          rgba(139,92,246,.16)
        );

      border:
        1px solid rgba(56,189,248,.18);

      box-shadow:
        0 0 22px rgba(56,189,248,.06),
        inset 0 1px 0 rgba(255,255,255,.06);

      font-size: 18px;

      transition:
        transform .3s ease,
        box-shadow .3s ease;
    }

    .card:hover .title-icon {
      transform: rotate(-4deg) scale(1.05);

      box-shadow:
        0 0 28px rgba(56,189,248,.12);
    }

    .subtitle {
      position: relative;
      z-index: 1;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.6;

      margin-bottom: 15px;
    }

    /* CODE BOX */

    .code-box {
      position: relative;
      z-index: 1;

      min-height: 68px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      padding: 11px 12px 11px 17px;

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          rgba(2,5,14,.74),
          rgba(8,12,27,.64)
        );

      border:
        1px solid rgba(255,255,255,.075);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.035);

      transition:
        border-color .3s ease,
        box-shadow .3s ease,
        transform .3s ease;
    }

    .code-box:hover {
      transform: translateY(-2px);

      border-color:
        rgba(56,189,248,.3);

      box-shadow:
        0 12px 35px rgba(0,0,0,.2),
        0 0 30px rgba(56,189,248,.05),
        inset 0 1px 0 rgba(255,255,255,.04);
    }

    .code {
      color: #fff;

      font-size: 20px;
      font-weight: 950;

      letter-spacing: 1.7px;

      word-break: break-all;

      text-shadow:
        0 0 20px rgba(56,189,248,.1);
    }

    /* COPY BUTTON */

    .copy-btn {
      position: relative;
      overflow: hidden;

      min-width: 84px;

      border: 1px solid rgba(255,255,255,.12);
      border-radius: 13px;

      padding: 11px 14px;

      background:
        linear-gradient(
          135deg,
          #38bdf8,
          #2563eb 55%,
          #7c3aed
        );

      color: #fff;

      font-size: 11px;
      font-weight: 950;
      letter-spacing: .7px;

      cursor: pointer;

      box-shadow:
        0 10px 25px rgba(37,99,235,.2);

      transition:
        transform .25s ease,
        box-shadow .25s ease,
        filter .25s ease;
    }

    .copy-btn::before {
      content: "";

      position: absolute;

      top: 0;
      left: -130%;

      width: 70%;
      height: 100%;

      transform: skewX(-22deg);

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.45),
          transparent
        );

      transition: left .65s ease;
    }

    .copy-btn:hover {
      transform: translateY(-2px);

      filter: brightness(1.08);

      box-shadow:
        0 14px 32px rgba(37,99,235,.3),
        0 0 25px rgba(56,189,248,.08);
    }

    .copy-btn:hover::before {
      left: 140%;
    }

    .copy-btn:active {
      transform: scale(.95);
    }

    /* LINK */

    .link-box {
      position: relative;
      z-index: 1;

      padding: 14px;

      margin-bottom: 11px;

      border-radius: 15px;

      color: #9da7c0;

      background:
        rgba(2,5,14,.58);

      border:
        1px solid rgba(255,255,255,.065);

      font-size: 12px;
      line-height: 1.55;

      word-break: break-all;

      transition:
        border-color .3s ease,
        background .3s ease;
    }

    .link-box:hover {
      border-color:
        rgba(139,92,246,.28);

      background:
        rgba(9,13,29,.72);
    }

    /* SHARE */

    .share-btn {
      position: relative;
      overflow: hidden;
      z-index: 1;

      width: 100%;
      height: 53px;

      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;

      background:
        linear-gradient(
          100deg,
          #2563eb,
          #7c3aed,
          #ec4899,
          #2563eb
        );

      background-size: 300% auto;

      color: #fff;

      font-size: 12px;
      font-weight: 950;
      letter-spacing: .8px;

      cursor: pointer;

      box-shadow:
        0 13px 35px rgba(88,28,135,.2);

      animation:
        gradientMove 6s linear infinite;

      transition:
        transform .25s ease,
        box-shadow .25s ease,
        filter .25s ease;
    }

    @keyframes gradientMove {
      to {
        background-position: 300% center;
      }
    }

    .share-btn:hover {
      transform: translateY(-3px);

      filter: brightness(1.08);

      box-shadow:
        0 18px 42px rgba(124,58,237,.28),
        0 0 35px rgba(236,72,153,.08);
    }

    .share-btn:active {
      transform: scale(.985);
    }

    .share-btn::before {
      content: "";

      position: absolute;

      top: 0;
      left: -120%;

      width: 65%;
      height: 100%;

      transform: skewX(-22deg);

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.4),
          transparent
        );

      transition: left .75s ease;
    }

    .share-btn:hover::before {
      left: 140%;
    }

    /* MESSAGES */

    .message {
      min-height: 18px;

      margin-top: 9px;

      text-align: center;

      font-size: 12px;
      font-weight: 750;
    }

    .success {
      color: var(--green);

      text-shadow:
        0 0 15px rgba(53,232,154,.18);
    }

    /* STATS */

    .stats {
      position: relative;
      z-index: 1;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 12px;
    }

    .stat {
      position: relative;
      overflow: hidden;

      padding: 21px 12px;

      text-align: center;

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          rgba(56,189,248,.065),
          rgba(139,92,246,.05),
          rgba(255,255,255,.018)
        );

      border:
        1px solid rgba(255,255,255,.065);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.035);

      transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
    }

    .stat::before {
      content: "";

      position: absolute;

      width: 110px;
      height: 110px;

      right: -65px;
      bottom: -65px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          rgba(56,189,248,.13),
          rgba(139,92,246,.08)
        );

      filter: blur(25px);
    }

    .stat:hover {
      transform: translateY(-5px);

      border-color:
        rgba(56,189,248,.22);

      box-shadow:
        0 15px 35px rgba(0,0,0,.2),
        0 0 30px rgba(56,189,248,.04);
    }

    .stat-number {
      position: relative;
      z-index: 1;

      font-size: 30px;
      line-height: 1;

      font-weight: 950;

      background:
        linear-gradient(
          90deg,
          #fff,
          #38bdf8,
          #8b5cf6
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      margin-bottom: 8px;
    }

    .stat-label {
      position: relative;
      z-index: 1;

      color: #8993aa;

      font-size: 11px;
      font-weight: 750;
    }

    /* MEMBERS */

    .member {
      position: relative;

      padding: 16px 3px;

      border-bottom:
        1px solid rgba(255,255,255,.065);

      transition:
        padding-left .25s ease,
        background .25s ease;
    }

    .member:last-child {
      border-bottom: none;
    }

    .member:hover {
      padding-left: 9px;
    }

    .member::before {
      content: "";

      position: absolute;

      left: -3px;
      top: 50%;

      width: 3px;
      height: 0;

      transform: translateY(-50%);

      border-radius: 999px;

      background:
        linear-gradient(
          180deg,
          #38bdf8,
          #8b5cf6
        );

      box-shadow:
        0 0 12px rgba(56,189,248,.5);

      transition: height .25s ease;
    }

    .member:hover::before {
      height: 28px;
    }

    .member-name {
      color: #fff;

      font-size: 14px;
      font-weight: 850;

      margin-bottom: 5px;
    }

    .member-mobile {
      color: #737e96;

      font-size: 11px;
    }

    /* LOADING */

    .loading {
      padding: 27px;

      text-align: center;

      color: #78839a;

      font-size: 12px;
    }

    .loading::after {
      content: "";

      display: block;

      width: 24px;
      height: 24px;

      margin: 13px auto 0;

      border-radius: 50%;

      border:
        2px solid rgba(255,255,255,.07);

      border-top-color: #38bdf8;
      border-right-color: #8b5cf6;

      animation:
        spin .75s linear infinite;

      box-shadow:
        0 0 18px rgba(56,189,248,.08);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* EMPTY */

    .empty {
      padding: 30px 14px;

      text-align: center;

      color: #78839a;

      line-height: 1.6;

      font-size: 12px;

      border:
        1px dashed rgba(255,255,255,.09);

      border-radius: 17px;

      background:
        rgba(255,255,255,.018);
    }

    /* ERROR */

    .error {
      padding: 14px;

      text-align: center;

      color: #ff8490;

      background:
        linear-gradient(
          135deg,
          rgba(255,95,109,.08),
          rgba(255,255,255,.015)
        );

      border:
        1px solid rgba(255,95,109,.18);

      border-radius: 16px;

      font-size: 12px;

      box-shadow:
        0 10px 30px rgba(255,0,50,.04);
    }

    /* ANIMATION */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(22px) scale(.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* MOBILE */

    @media (max-width: 480px) {

      .topbar {
        height: 66px;
        padding: 0 13px;
      }

      .brand img {
        width: 34px;
        height: 34px;
      }

      .brand span {
        font-size: 11px;
        letter-spacing: 1.4px;
      }

      .container {
        width: min(100% - 18px, 680px);
        padding-top: 22px;
      }

      .hero {
        margin-bottom: 21px;
      }

      .hero h1 {
        font-size: 33px;
      }

      .hero p {
        font-size: 12px;
      }

      .card {
        padding: 17px;
        border-radius: 21px;
      }

      .title {
        font-size: 16px;
      }

      .code-box {
        align-items: stretch;
        flex-direction: column;
      }

      .code {
        text-align: center;
        font-size: 19px;
      }

      .copy-btn {
        width: 100%;
      }

      .share-btn {
        height: 51px;
      }
    }

    @media (max-width: 350px) {

      .stats {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

<header class="topbar">

  <a href="home.html" class="back" aria-label="Back">
    ←
  </a>

  <div class="brand">
    <img src="assets/logo.png" alt="TRUE WALK Logo">
    <span>TRUE WALK</span>
  </div>

  <div class="top-space"></div>

</header>


<main class="container">

  <section class="hero">

    <div class="hero-badge">
      Referral Center
    </div>

    <h1>
      Invite <span>&amp; Earn</span>
    </h1>

    <p>
      Share your referral code and invite friends
      using your personal referral link.
    </p>

  </section>


  <!-- REFERRAL AREA -->

  <div id="referralArea">

    <div class="loading">
      Loading referral information...
    </div>

  </div>


  <!-- STATS -->

  <div class="card">

    <div class="title">
      <div class="title-icon">◈</div>
      <span>Referral Overview</span>
    </div>

    <div class="stats">

      <div class="stat">

        <div
          id="totalReferrals"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Total Referrals
        </div>

      </div>


      <div class="stat">

        <div
          id="activeReferrals"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          Active Referrals
        </div>

      </div>

    </div>

  </div>


  <!-- MEMBERS -->

  <div class="card">

    <div class="title">
      <div class="title-icon">👥</div>
      <span>My Referrals</span>
    </div>

    <div id="membersArea">

      <div class="loading">
        Loading...
      </div>

    </div>

  </div>

</main>


<script>

  let currentReferralCode = "";


  /* =========================
     LOAD REFERRAL DATA
  ========================= */

  async function loadReferral() {

    const referralArea =
      document.getElementById("referralArea");

    const membersArea =
      document.getElementById("membersArea");


    try {

      const meResponse =
        await fetch("/api/me", {
          credentials: "include"
        });


      if (meResponse.status === 401) {

        window.location.href = "login.html";

        return;

      }


      const meData =
        await meResponse.json();


      const user =
        meData.user ||
        meData;


      const referralCode =
        user.referral_code ||
        user.referralCode ||
        "";


      currentReferralCode =
        referralCode;


      if (!referralCode) {

        referralArea.innerHTML = `
          <div class="error">
            Referral code is not available.
          </div>
        `;

      } else {

        const referralLink =
          window.location.origin +
          "/register.html?ref=" +
          encodeURIComponent(referralCode);


        referralArea.innerHTML = `

          <div class="card">

            <div class="title">
              <div class="title-icon">⌁</div>
              <span>Your Referral Code</span>
            </div>

            <div class="subtitle">
              Your personal referral code is ready.
              Share it with your friends.
            </div>

            <div class="code-box">

              <div class="code">
                ${escapeHtml(referralCode)}
              </div>

              <button
                class="copy-btn"
                onclick="copyCode()"
              >
                COPY
              </button>

            </div>

            <div
              id="copyMessage"
              class="message"
            ></div>

          </div>


          <div class="card">

            <div class="title">
              <div class="title-icon">↗</div>
              <span>Referral Link</span>
            </div>

            <div class="link-box">
              ${escapeHtml(referralLink)}
            </div>

            <button
              class="share-btn"
              onclick="shareReferral()"
            >
              SHARE REFERRAL LINK
            </button>

            <div
              id="shareMessage"
              class="message"
            ></div>

          </div>

        `;

      }


      await loadReferralUsers();


    } catch (error) {

      console.error(error);

      referralArea.innerHTML = `
        <div class="error">
          Unable to load referral information.
        </div>
      `;

      membersArea.innerHTML = `
        <div class="error">
          Unable to load referrals.
        </div>
      `;

    }

  }


  /* =========================
     LOAD REFERRAL USERS
  ========================= */

  async function loadReferralUsers() {

    const membersArea =
      document.getElementById("membersArea");


    try {

      const response =
        await fetch("/api/referrals", {
          credentials: "include"
        });


      if (response.status === 404) {

        showEmptyReferrals(
          "No referral data available yet."
        );

        return;

      }


      if (response.status === 401) {

        window.location.href =
          "login.html";

        return;

      }


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.message ||
          "Unable to load referrals."
        );

      }


      const users =
        Array.isArray(data)
          ? data
          : (
              data.referrals ||
              data.users ||
              []
            );


      updateStats(users);


      if (users.length === 0) {

        showEmptyReferrals(
          "No referrals yet. Share your referral link to invite users."
        );

        return;

      }


      membersArea.innerHTML = "";


      users.forEach(user => {

        const name =
          user.name ||
          user.full_name ||
          "User";


        const mobile =
          user.mobile ||
          user.phone ||
          user.phone_number ||
          "-";


        const member =
          document.createElement("div");


        member.className =
          "member";


        member.innerHTML = `

          <div class="member-name">
            ${escapeHtml(name)}
          </div>

          <div class="member-mobile">
            ${escapeHtml(mobile)}
          </div>

        `;


        membersArea.appendChild(member);

      });


    } catch (error) {

      console.error(error);

      showEmptyReferrals(
        "No referral data available yet."
      );

    }

  }


  /* =========================
     STATS
  ========================= */

  function updateStats(users) {

    const total =
      users.length;


    const active =
      users.filter(user => {

        const status =
          String(
            user.status ||
            ""
          ).toLowerCase();


        return (
          status === "active" ||
          status === "approved"
        );

      }).length;


    document.getElementById(
      "totalReferrals"
    ).textContent = total;


    document.getElementById(
      "activeReferrals"
    ).textContent = active;

  }


  /* =========================
     EMPTY
  ========================= */

  function showEmptyReferrals(message) {

    document.getElementById(
      "membersArea"
    ).innerHTML = `

      <div class="empty">
        <div style="font-size:28px;margin-bottom:8px;">
          👥
        </div>

        ${escapeHtml(message)}

      </div>

    `;

  }


  /* =========================
     COPY CODE
  ========================= */

  async function copyCode() {

    const message =
      document.getElementById("copyMessage");


    if (!currentReferralCode) {

      message.textContent =
        "Referral code unavailable.";

      return;

    }


    try {

      await navigator.clipboard.writeText(
        currentReferralCode
      );


      message.className =
        "message success";


      message.textContent =
        "✓ Referral code copied.";

    } catch (error) {

      message.className =
        "message";


      message.textContent =
        "Unable to copy code.";

    }

  }


  /* =========================
     SHARE LINK
  ========================= */

  async function shareReferral() {

    const shareMessage =
      document.getElementById("shareMessage");


    const link =
      window.location.origin +
      "/register.html?ref=" +
      encodeURIComponent(
        currentReferralCode
      );


    if (navigator.share) {

      try {

        await navigator.share({

          title: "TRUE WALK",

          text:
            "Join TRUE WALK using my referral link.",

          url: link

        });

      } catch (error) {
        // User cancelled share.
      }

      return;

    }


    try {

      await navigator.clipboard.writeText(link);


      shareMessage.className =
        "message success";


      shareMessage.textContent =
        "✓ Referral link copied.";

    } catch (error) {

      shareMessage.className =
        "message";


      shareMessage.textContent =
        "Unable to copy referral link.";

    }

  }


  /* =========================
     HTML ESCAPE
  ========================= */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================
     START
  ========================= */

  loadReferral();

</script>

</body>
</html>
