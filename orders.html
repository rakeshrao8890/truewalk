<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050711">

  <title>TRUE WALK - Orders</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #050711;
      --blue: #38bdf8;
      --blue2: #2563eb;
      --purple: #8b5cf6;
      --pink: #ec4899;

      --white: #fff;
      --text: #eef2ff;
      --muted: #8993aa;

      --green: #42e899;
      --yellow: #ffc857;
      --red: #ff6868;

      --border: rgba(255,255,255,.085);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 8% 0%,
          rgba(56,189,248,.14),
          transparent 29%
        ),
        radial-gradient(
          circle at 96% 18%,
          rgba(139,92,246,.16),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(236,72,153,.08),
          transparent 35%
        ),
        linear-gradient(
          145deg,
          #03040a,
          #080b18 50%,
          #04050c
        );
    }

    body::before,
    body::after {
      content: "";

      position: fixed;
      z-index: -1;

      width: 340px;
      height: 340px;

      border-radius: 50%;

      pointer-events: none;

      filter: blur(105px);

      opacity: .15;

      animation:
        orbMove 13s ease-in-out infinite alternate;
    }

    body::before {
      background: #2563eb;
      left: -190px;
      top: 90px;
    }

    body::after {
      background: #a855f7;
      right: -190px;
      bottom: 40px;

      animation-delay: -5s;
    }

    @keyframes orbMove {
      from {
        transform: translate(0,0) scale(1);
      }

      to {
        transform: translate(50px,35px) scale(1.1);
      }
    }

    /* TOPBAR */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;

      height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 18px;

      background:
        linear-gradient(
          180deg,
          rgba(5,7,17,.95),
          rgba(5,7,17,.74)
        );

      border-bottom:
        1px solid rgba(255,255,255,.07);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .topbar::after {
      content: "";

      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(56,189,248,.5),
          rgba(139,92,246,.5),
          transparent
        );
    }

    .back {
      width: 43px;
      height: 43px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      text-decoration: none;

      font-size: 24px;

      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.08),
          rgba(255,255,255,.025)
        );

      border:
        1px solid rgba(255,255,255,.09);

      transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;
    }

    .back:hover {
      transform: translateX(-4px);

      background:
        rgba(56,189,248,.08);

      border-color:
        rgba(56,189,248,.38);

      box-shadow:
        0 0 25px rgba(56,189,248,.1);
    }

    .back:active {
      transform: scale(.94);
    }

    .brand {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);

      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand img {
      width: 38px;
      height: 38px;

      object-fit: contain;
      border-radius: 50%;

      filter:
        drop-shadow(
          0 0 9px rgba(56,189,248,.25)
        )
        drop-shadow(
          0 0 18px rgba(139,92,246,.14)
        );

      animation:
        logoFloat 4s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-3px) rotate(2deg);
      }
    }

    .brand span {
      font-size: 13px;
      font-weight: 950;
      letter-spacing: 1.8px;

      background:
        linear-gradient(
          90deg,
          #fff,
          #38bdf8,
          #8b5cf6,
          #ec4899,
          #fff
        );

      background-size: 300% auto;

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      animation:
        textShine 6s linear infinite;
    }

    @keyframes textShine {
      to {
        background-position: 300% center;
      }
    }

    .top-space {
      width: 43px;
    }

    /* MAIN */

    .container {
      width: min(100% - 24px, 680px);

      margin: auto;

      padding: 28px 0 55px;
    }

    /* HERO */

    .hero {
      position: relative;

      margin-bottom: 23px;

      animation:
        fadeUp .7s cubic-bezier(.2,.8,.2,1) both;
    }

    .hero::before {
      content: "";

      position: absolute;

      width: 190px;
      height: 90px;

      left: 20px;
      top: 10px;

      background:
        linear-gradient(
          90deg,
          #38bdf8,
          #8b5cf6
        );

      filter: blur(65px);

      opacity: .1;

      pointer-events: none;
    }

    .hero-badge {
      position: relative;

      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 8px 13px;

      margin-bottom: 14px;

      border-radius: 999px;

      color: #a9ddff;

      background:
        linear-gradient(
          135deg,
          rgba(56,189,248,.1),
          rgba(139,92,246,.08)
        );

      border:
        1px solid rgba(56,189,248,.2);

      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;

      text-transform: uppercase;
    }

    .hero-badge::before {
      content: "";

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #38bdf8;

      box-shadow:
        0 0 8px #38bdf8,
        0 0 17px rgba(56,189,248,.65);

      animation:
        pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.45);
      }
    }

    .hero h1 {
      position: relative;

      font-size: clamp(32px, 8vw, 45px);

      line-height: 1;

      font-weight: 950;

      letter-spacing: -1.8px;
    }

    .hero h1 span {
      background:
        linear-gradient(
          90deg,
          #38bdf8,
          #8b5cf6 50%,
          #ec4899
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .hero p {
      position: relative;

      margin-top: 11px;

      max-width: 480px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.6;
    }

    /* REFRESH BUTTON */

    .refresh {
      position: relative;
      overflow: hidden;

      width: 100%;
      height: 53px;

      margin-bottom: 17px;

      border:
        1px solid rgba(255,255,255,.12);

      border-radius: 16px;

      background:
        linear-gradient(
          100deg,
          #2563eb,
          #7c3aed,
          #ec4899,
          #2563eb
        );

      background-size: 300% auto;

      color: #fff;

      font-size: 12px;
      font-weight: 950;
      letter-spacing: .8px;

      cursor: pointer;

      box-shadow:
        0 13px 35px rgba(37,99,235,.2);

      animation:
        gradientMove 6s linear infinite;

      transition:
        transform .25s ease,
        box-shadow .25s ease,
        filter .25s ease;
    }

    @keyframes gradientMove {
      to {
        background-position: 300% center;
      }
    }

    .refresh:hover {
      transform: translateY(-3px);

      filter: brightness(1.08);

      box-shadow:
        0 18px 42px rgba(124,58,237,.28),
        0 0 35px rgba(56,189,248,.07);
    }

    .refresh:active {
      transform: scale(.985);
    }

    .refresh::before {
      content: "";

      position: absolute;

      top: 0;
      left: -120%;

      width: 65%;
      height: 100%;

      transform: skewX(-22deg);

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.42),
          transparent
        );

      transition: left .7s ease;
    }

    .refresh:hover::before {
      left: 140%;
    }

    /* LOADING */

    .loading {
      padding: 40px 20px;

      text-align: center;

      color: #78839a;

      font-size: 12px;
    }

    .loading::after {
      content: "";

      display: block;

      width: 24px;
      height: 24px;

      margin: 13px auto 0;

      border-radius: 50%;

      border:
        2px solid rgba(255,255,255,.07);

      border-top-color: #38bdf8;
      border-right-color: #8b5cf6;

      animation:
        spin .75s linear infinite;

      box-shadow:
        0 0 18px rgba(56,189,248,.08);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* EMPTY */

    .empty {
      position: relative;
      overflow: hidden;

      padding: 46px 20px;

      text-align: center;

      background:
        linear-gradient(
          145deg,
          rgba(20,25,47,.8),
          rgba(9,12,25,.72)
        );

      border:
        1px solid var(--border);

      border-radius: 23px;

      color: #858fa5;

      box-shadow:
        0 22px 60px rgba(0,0,0,.3),
        inset 0 1px 0 rgba(255,255,255,.04);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      animation:
        fadeUp .5s ease both;
    }

    .empty::before {
      content: "";

      position: absolute;

      width: 160px;
      height: 160px;

      top: -100px;
      right: -80px;

      border-radius: 50%;

      background:
        rgba(56,189,248,.12);

      filter: blur(35px);
    }

    .empty-icon {
      position: relative;

      width: 70px;
      height: 70px;

      margin: 0 auto 17px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 22px;

      font-size: 31px;

      background:
        linear-gradient(
          135deg,
          rgba(56,189,248,.13),
          rgba(139,92,246,.12)
        );

      border:
        1px solid rgba(56,189,248,.17);

      box-shadow:
        0 0 35px rgba(56,189,248,.06);
    }

    .empty-title {
      position: relative;

      color: #fff;

      font-size: 18px;
      font-weight: 900;

      margin-bottom: 7px;
    }

    .empty-text {
      position: relative;

      font-size: 12px;
      line-height: 1.5;
    }

    /* ORDER CARD */

    .order {
      position: relative;
      overflow: hidden;

      padding: 19px;

      margin-bottom: 14px;

      border-radius: 21px;

      background:
        linear-gradient(
          145deg,
          rgba(20,25,47,.82),
          rgba(9,12,25,.76)
        );

      border:
        1px solid var(--border);

      box-shadow:
        0 18px 52px rgba(0,0,0,.32),
        inset 0 1px 0 rgba(255,255,255,.04);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      animation:
        fadeUp .55s cubic-bezier(.2,.8,.2,1) both;

      transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
    }

    .order::before {
      content: "";

      position: absolute;

      width: 150px;
      height: 150px;

      right: -85px;
      top: -85px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          rgba(56,189,248,.14),
          rgba(139,92,246,.1)
        );

      filter: blur(30px);
    }

    .order::after {
      content: "";

      position: absolute;

      left: 0;
      top: 0;

      width: 100%;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(56,189,248,.22),
          rgba(139,92,246,.2),
          transparent
        );
    }

    .order:hover {
      transform: translateY(-4px);

      border-color:
        rgba(56,189,248,.22);

      box-shadow:
        0 25px 65px rgba(0,0,0,.4),
        0 0 30px rgba(56,189,248,.04);
    }

    .order-top {
      position: relative;
      z-index: 1;

      display: flex;

      justify-content: space-between;
      align-items: flex-start;

      gap: 12px;

      margin-bottom: 14px;
    }

    .order-title {
      font-size: 17px;
      font-weight: 900;

      word-break: break-word;
    }

    /* STATUS */

    .status {
      flex-shrink: 0;

      padding: 6px 11px;

      border-radius: 999px;

      font-size: 9px;
      font-weight: 950;

      letter-spacing: .6px;

      text-transform: uppercase;

      color: var(--green);

      background:
        rgba(66,232,153,.08);

      border:
        1px solid rgba(66,232,153,.16);

      box-shadow:
        0 0 18px rgba(66,232,153,.03);
    }

    .pending {
      color: var(--yellow);

      background:
        rgba(255,200,87,.08);

      border-color:
        rgba(255,200,87,.17);
    }

    .failed {
      color: var(--red);

      background:
        rgba(255,104,104,.08);

      border-color:
        rgba(255,104,104,.17);
    }

    /* ROW */

    .row {
      position: relative;
      z-index: 1;

      display: flex;

      justify-content: space-between;

      gap: 15px;

      padding: 11px 0;

      border-bottom:
        1px solid rgba(255,255,255,.06);
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      color: #707b93;

      font-size: 11px;
      font-weight: 700;
    }

    .value {
      max-width: 65%;

      color: #cfd5e5;

      font-size: 11px;

      text-align: right;

      word-break: break-all;
    }

    .amount {
      color: #fff;

      font-size: 20px;
      font-weight: 950;

      background:
        linear-gradient(
          90deg,
          #fff,
          #38bdf8,
          #8b5cf6
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      text-shadow:
        0 0 20px rgba(56,189,248,.08);
    }

    /* ERROR */

    .error {
      padding: 15px;

      border-radius: 16px;

      text-align: center;

      color: var(--red);

      background:
        linear-gradient(
          135deg,
          rgba(255,104,104,.08),
          rgba(255,255,255,.015)
        );

      border:
        1px solid rgba(255,104,104,.17);

      font-size: 12px;

      line-height: 1.5;

      box-shadow:
        0 12px 30px rgba(255,0,50,.04);
    }

    /* ANIMATION */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* MOBILE */

    @media (max-width: 480px) {

      .topbar {
        height: 66px;
        padding: 0 13px;
      }

      .brand img {
        width: 34px;
        height: 34px;
      }

      .brand span {
        font-size: 11px;
        letter-spacing: 1.4px;
      }

      .container {
        width: min(100% - 18px, 680px);
        padding-top: 21px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .hero p {
        font-size: 12px;
      }

      .order {
        padding: 17px;
        border-radius: 19px;
      }

      .order-top {
        align-items: flex-start;
      }

      .order-title {
        font-size: 16px;
      }

      .status {
        font-size: 8px;
        padding: 5px 8px;
      }

      .value {
        max-width: 60%;
      }

      .empty {
        padding: 40px 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">

    <a href="home.html" class="back" aria-label="Back">
      ←
    </a>

    <div class="brand">

      <img
        src="assets/logo.png"
        alt="TRUE WALK Logo"
      >

      <span>TRUE WALK</span>

    </div>

    <div class="top-space"></div>

  </header>


  <main class="container">

    <section class="hero">

      <div class="hero-badge">
        Transaction Center
      </div>

      <h1>
        My <span>Orders</span>
      </h1>

      <p>
        View your payment and order history
        in one place.
      </p>

    </section>


    <button
      class="refresh"
      onclick="loadOrders()"
    >
      ↻ &nbsp; REFRESH ORDERS
    </button>


    <div id="ordersContainer">

      <div class="loading">
        Loading orders...
      </div>

    </div>

  </main>


<script>

async function loadOrders() {

  const container =
    document.getElementById(
      "ordersContainer"
    );


  container.innerHTML = `
    <div class="loading">
      Loading orders...
    </div>
  `;


  try {

    const response =
      await fetch(
        "/api/orders",
        {
          credentials: "include"
        }
      );


    if (response.status === 401) {

      window.location.href =
        "login.html";

      return;

    }


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.message ||
        "Unable to load orders."
      );

    }


    /*
      Backend अलग-अलग format में data
      भेज सकता है, इसलिए दोनों handle होंगे.
    */

    const orders =
      Array.isArray(data)
        ? data
        : (
            data.orders ||
            data.payments ||
            []
          );


    if (orders.length === 0) {

      container.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            📋
          </div>

          <div class="empty-title">
            No Orders Yet
          </div>

          <div class="empty-text">
            Your payment history will appear here.
          </div>

        </div>

      `;

      return;

    }


    container.innerHTML = "";


    orders.forEach((order, index) => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "order";


      item.style.animationDelay =
        `${Math.min(index * 0.05, 0.4)}s`;


      const rawStatus =
        String(
          order.status ||
          order.payment_status ||
          "pending"
        ).toLowerCase();


      let statusClass = "";


      if (
        rawStatus.includes("pending")
      ) {

        statusClass =
          "pending";

      }


      if (
        rawStatus.includes("fail")
      ) {

        statusClass =
          "failed";

      }


      const statusText =
        order.status ||
        order.payment_status ||
        "Pending";


      const amount =
        Number(
          order.amount ||
          order.amount_inr ||
          0
        );


      const dateValue =
        order.created_at ||
        order.createdAt ||
        order.date;


      let dateText = "-";


      if (dateValue) {

        const date =
          new Date(dateValue);


        if (
          !isNaN(
            date.getTime()
          )
        ) {

          dateText =
            date.toLocaleString(
              "en-IN",
              {
                dateStyle: "medium",
                timeStyle: "short"
              }
            );

        } else {

          dateText =
            String(dateValue);

        }

      }


      const orderId =
        order.order_id ||
        order.razorpay_order_id ||
        order.orderId ||
        "-";


      const paymentId =
        order.payment_id ||
        order.razorpay_payment_id ||
        order.paymentId ||
        "-";


      const plan =
        order.plan ||
        "Deposit";


      item.innerHTML = `

        <div class="order-top">

          <div class="order-title">
            ${escapeHtml(plan)}
          </div>

          <div class="status ${statusClass}">
            ${escapeHtml(statusText)}
          </div>

        </div>


        <div class="row">

          <div class="label">
            Amount
          </div>

          <div class="value amount">
            ₹${amount.toLocaleString("en-IN")}
          </div>

        </div>


        <div class="row">

          <div class="label">
            Order ID
          </div>

          <div class="value">
            ${escapeHtml(orderId)}
          </div>

        </div>


        <div class="row">

          <div class="label">
            Payment ID
          </div>

          <div class="value">
            ${escapeHtml(paymentId)}
          </div>

        </div>


        <div class="row">

          <div class="label">
            Date
          </div>

          <div class="value">
            ${escapeHtml(dateText)}
          </div>

        </div>

      `;


      container.appendChild(item);

    });


  } catch (error) {

    console.error(error);


    container.innerHTML = `

      <div class="error">

        ${escapeHtml(
          error.message ||
          "Unable to load orders."
        )}

      </div>

    `;

  }

}


/* =========================
   SECURITY HELPER
========================= */

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   LOAD ORDERS
========================= */

loadOrders();

</script>

</body>
</html>
