<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TRUE WALK - Register</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #05060d;
      --bg-2: #080a16;

      --blue: #35a7ff;
      --blue-2: #176cff;
      --purple: #8b5cf6;
      --pink: #ff4ecd;

      --text: #ffffff;
      --muted: #9298ad;

      --border: rgba(255,255,255,0.09);
    }

    body {
      min-height: 100vh;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 8% 8%,
          rgba(53,167,255,0.16),
          transparent 29%
        ),
        radial-gradient(
          circle at 92% 25%,
          rgba(139,92,246,0.16),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(255,78,205,0.09),
          transparent 35%
        ),
        var(--bg);

      overflow-x: hidden;
    }

    button,
    input,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .background {
      position: fixed;
      inset: 0;

      overflow: hidden;

      pointer-events: none;

      z-index: 0;
    }

    .background::before {
      content: "";

      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.017) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.017) 1px,
          transparent 1px
        );

      background-size: 55px 55px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 85%
        );
    }

    .orb {
      position: absolute;

      border-radius: 50%;

      filter: blur(80px);

      opacity: 0.34;

      animation:
        floatOrb 11s ease-in-out infinite;
    }

    .orb-one {
      width: 240px;
      height: 240px;

      background: var(--blue);

      left: -105px;
      top: -100px;
    }

    .orb-two {
      width: 210px;
      height: 210px;

      background: var(--purple);

      right: -100px;
      top: 32%;

      animation-delay: -3s;
    }

    .orb-three {
      width: 240px;
      height: 240px;

      background: var(--pink);

      bottom: -140px;
      left: 30%;

      animation-delay: -6s;
    }

    @keyframes floatOrb {
      0%, 100% {
        transform:
          translate3d(0,0,0)
          scale(1);
      }

      50% {
        transform:
          translate3d(28px,-34px,0)
          scale(1.08);
      }
    }

    /* =========================
       TOP BRAND
    ========================= */

    .top-brand {
      position: fixed;

      top: 20px;
      left: 22px;

      display: flex;
      align-items: center;

      gap: 10px;

      z-index: 10;
    }

    .brand-icon {
      position: relative;

      width: 39px;
      height: 39px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      font-size: 14px;
      font-weight: 950;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--purple) 55%,
          var(--pink)
        );

      box-shadow:
        0 0 0 1px rgba(255,255,255,0.13),
        0 0 25px rgba(53,167,255,0.30);

      animation:
        logoPulse 4s ease-in-out infinite;
    }

    .brand-icon::after {
      content: "";

      position: absolute;
      inset: 2px;

      border-radius: 11px;

      border:
        1px solid rgba(255,255,255,0.22);
    }

    @keyframes logoPulse {
      0%, 100% {
        transform: translateY(0);

        box-shadow:
          0 0 0 1px rgba(255,255,255,0.13),
          0 0 22px rgba(53,167,255,0.25);
      }

      50% {
        transform: translateY(-2px);

        box-shadow:
          0 0 0 1px rgba(255,255,255,0.18),
          0 0 34px rgba(139,92,246,0.38);
      }
    }

    .brand-text {
      font-size: 15px;

      font-weight: 900;

      letter-spacing: 0.4px;
    }

    .brand-text span {
      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--purple),
          var(--pink),
          var(--blue)
        );

      background-size: 300% auto;

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      animation:
        gradientMove 5s linear infinite;
    }

    @keyframes gradientMove {
      to {
        background-position: 300% center;
      }
    }

    /* =========================
       PAGE
    ========================= */

    .register-page {
      position: relative;

      z-index: 2;

      min-height: 100vh;

      display: flex;

      justify-content: center;
      align-items: center;

      padding:
        75px 18px
        35px;
    }

    /* =========================
       REGISTER CARD
    ========================= */

    .register-box {
      position: relative;

      overflow: hidden;

      width: 100%;
      max-width: 460px;

      padding:
        31px 25px
        27px;

      border-radius: 29px;

      background:
        linear-gradient(
          145deg,
          rgba(18,21,34,0.88),
          rgba(8,10,18,0.78)
        );

      border:
        1px solid rgba(255,255,255,0.09);

      box-shadow:
        0 35px 90px rgba(0,0,0,0.48),
        0 0 55px rgba(53,167,255,0.06);

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      animation:
        cardIn 0.75s
        cubic-bezier(.2,.8,.2,1)
        both;
    }

    .register-box::before {
      content: "";

      position: absolute;

      width: 190px;
      height: 190px;

      right: -110px;
      top: -110px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(53,167,255,0.22),
          transparent 70%
        );

      filter: blur(5px);

      animation:
        cardGlow 6s ease-in-out infinite;
    }

    .register-box::after {
      content: "";

      position: absolute;

      width: 150px;
      height: 150px;

      left: -100px;
      bottom: -100px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255,78,205,0.14),
          transparent 70%
        );

      filter: blur(15px);
    }

    @keyframes cardGlow {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.25);
      }
    }

    @keyframes cardIn {
      from {
        opacity: 0;

        transform:
          translateY(25px)
          scale(0.97);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }

    /* =========================
       LOGO
    ========================= */

    .logo-area {
      position: relative;

      z-index: 2;

      text-align: center;

      margin-bottom: 27px;
    }

    .logo-frame {
      position: relative;

      width: 90px;
      height: 90px;

      margin:
        0 auto
        15px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(53,167,255,0.14),
          rgba(139,92,246,0.12),
          rgba(255,255,255,0.035)
        );

      border:
        1px solid rgba(53,167,255,0.25);

      box-shadow:
        0 0 35px rgba(53,167,255,0.16),
        inset 0 0 25px rgba(255,255,255,0.025);

      animation:
        logoFloat 4s ease-in-out infinite;
    }

    .logo-frame::before {
      content: "";

      position: absolute;

      inset: -5px;

      border-radius: 28px;

      border:
        1px solid rgba(139,92,246,0.18);

      animation:
        frameRotate 8s linear infinite;
    }

    .logo-frame::after {
      content: "";

      position: absolute;

      inset: 0;

      border-radius: 24px;

      background:
        linear-gradient(
          120deg,
          transparent 25%,
          rgba(255,255,255,0.12),
          transparent 65%
        );

      transform:
        translateX(-120%);

      animation:
        logoShine 4.5s ease-in-out infinite;
    }

    .logo-frame img {
      position: relative;

      z-index: 2;

      width: 70px;
      height: 70px;

      object-fit: contain;

      border-radius: 18px;
    }

    @keyframes logoFloat {
      0%, 100% {
        transform:
          translateY(0);
      }

      50% {
        transform:
          translateY(-6px);
      }
    }

    @keyframes frameRotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes logoShine {
      0%, 35% {
        transform:
          translateX(-120%);
      }

      60%, 100% {
        transform:
          translateX(120%);
      }
    }

    .logo-area h1 {
      position: relative;

      font-size: 28px;

      font-weight: 950;

      letter-spacing: -0.6px;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          #65baff,
          #a681ff,
          #ffffff
        );

      background-size: 250% auto;

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      animation:
        textShine 5s linear infinite;
    }

    @keyframes textShine {
      to {
        background-position: 250% center;
      }
    }

    .logo-area p {
      margin-top: 7px;

      color: var(--muted);

      font-size: 13px;
    }

    /* =========================
       FORM
    ========================= */

    .form-group {
      position: relative;

      z-index: 2;

      margin-bottom: 16px;
    }

    .form-group label {
      display: block;

      margin-bottom: 8px;

      color: #d5d8e4;

      font-size: 12px;

      font-weight: 750;

      letter-spacing: 0.2px;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;

      left: 15px;
      top: 50%;

      transform:
        translateY(-50%);

      font-size: 16px;

      opacity: 0.65;

      pointer-events: none;

      transition:
        transform 0.25s ease,
        opacity 0.25s ease;
    }

    .form-group input {
      width: 100%;
      height: 52px;

      padding:
        0 15px
        0 43px;

      border:
        1px solid rgba(255,255,255,0.09);

      border-radius: 15px;

      outline: none;

      color: #fff;

      background:
        rgba(255,255,255,0.045);

      font-size: 14px;

      transition:
        border-color 0.3s ease,
        background 0.3s ease,
        box-shadow 0.3s ease,
        transform 0.3s ease;

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,0.025);
    }

    .form-group input::placeholder {
      color: #666d80;
    }

    .form-group input:hover {
      border-color:
        rgba(255,255,255,0.15);
    }

    .form-group input:focus {
      border-color:
        rgba(53,167,255,0.65);

      background:
        rgba(53,167,255,0.045);

      box-shadow:
        0 0 0 3px
        rgba(53,167,255,0.08),

        0 10px 28px
        rgba(0,0,0,0.20);
    }

    .input-wrap:focus-within .input-icon {
      opacity: 1;

      transform:
        translateY(-50%)
        scale(1.08);
    }

    /* =========================
       REGISTER BUTTON
    ========================= */

    .register-btn {
      position: relative;

      overflow: hidden;

      z-index: 2;

      width: 100%;
      height: 54px;

      margin-top: 5px;

      border: none;

      border-radius: 15px;

      color: #fff;

      background:
        linear-gradient(
          105deg,
          #176cff,
          #6b45e8,
          #c342c5,
          #176cff
        );

      background-size: 300% auto;

      font-size: 14px;

      font-weight: 900;

      letter-spacing: 0.8px;

      cursor: pointer;

      box-shadow:
        0 14px 38px
        rgba(53,167,255,0.22),

        0 0 25px
        rgba(139,92,246,0.08);

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        filter 0.3s ease;

      animation:
        buttonGradient 5s linear infinite;
    }

    @keyframes buttonGradient {
      to {
        background-position:
          300% center;
      }
    }

    .register-btn::before {
      content: "";

      position: absolute;

      top: 0;
      left: -120%;

      width: 80%;
      height: 100%;

      transform:
        skewX(-20deg);

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.35),
          transparent
        );

      transition:
        left 0.65s ease;
    }

    .register-btn:hover::before {
      left: 140%;
    }

    .register-btn:hover {
      transform:
        translateY(-3px);

      filter:
        brightness(1.08);

      box-shadow:
        0 20px 48px
        rgba(53,167,255,0.30),

        0 0 30px
        rgba(139,92,246,0.12);
    }

    .register-btn:active {
      transform:
        scale(0.98);
    }

    .register-btn:disabled {
      opacity: 0.6;

      cursor: not-allowed;

      transform: none;

      filter: none;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
      display: none;

      position: relative;

      z-index: 2;

      margin-top: 14px;

      padding: 12px 13px;

      border-radius: 13px;

      text-align: center;

      font-size: 12px;

      line-height: 1.5;

      animation:
        messageIn 0.3s ease;
    }

    .message.error {
      display: block;

      color: #ff9d9d;

      background:
        rgba(255,55,70,0.08);

      border:
        1px solid rgba(255,70,80,0.18);

      box-shadow:
        0 10px 25px rgba(255,0,0,0.04);
    }

    .message.success {
      display: block;

      color: #83e6aa;

      background:
        rgba(40,210,110,0.08);

      border:
        1px solid rgba(40,210,110,0.18);

      box-shadow:
        0 10px 25px rgba(40,210,110,0.04);
    }

    @keyframes messageIn {
      from {
        opacity: 0;

        transform:
          translateY(-5px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }
    }

    /* =========================
       LOGIN
    ========================= */

    .login-text {
      position: relative;

      z-index: 2;

      text-align: center;

      margin-top: 23px;

      color: #777e92;

      font-size: 13px;
    }

    .login-text a {
      color: #63b9ff;

      font-weight: 850;

      text-decoration: none;

      margin-left: 4px;

      transition:
        color 0.2s ease;
    }

    .login-text a:hover {
      color: #b38cff;
    }

    /* =========================
       SECURITY LINE
    ========================= */

    .bottom-note {
      position: relative;

      z-index: 2;

      margin-top: 18px;

      text-align: center;

      color: #555d70;

      font-size: 10px;

      letter-spacing: 0.3px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 520px) {

      .top-brand {
        top: 14px;
        left: 14px;
      }

      .brand-icon {
        width: 34px;
        height: 34px;

        border-radius: 10px;
      }

      .brand-text {
        font-size: 13px;
      }

      .register-page {
        padding:
          65px 12px
          25px;
      }

      .register-box {
        padding:
          27px 18px
          24px;

        border-radius: 24px;
      }

      .logo-frame {
        width: 80px;
        height: 80px;
      }

      .logo-frame img {
        width: 63px;
        height: 63px;
      }

      .logo-area h1 {
        font-size: 25px;
      }

      .form-group input {
        height: 50px;
      }

      .register-btn {
        height: 52px;
      }
    }

    @media (max-width: 360px) {

      .register-box {
        padding:
          24px 15px
          22px;
      }

      .form-group {
        margin-bottom: 14px;
      }
    }

    /* =========================
       REDUCED MOTION
    ========================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- Animated Background -->

  <div class="background">
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
    <div class="orb orb-three"></div>
  </div>


  <!-- Brand -->

  <div class="top-brand">

    <div class="brand-icon">
      TW
    </div>

    <div class="brand-text">
      TRUE <span>WALK</span>
    </div>

  </div>


  <!-- Register -->

  <div class="register-page">

    <div class="register-box">


      <!-- LOGO -->

      <div class="logo-area">

        <div class="logo-frame">

          <img
            src="assets/logo.png"
            alt="TRUE WALK Logo"
          >

        </div>

        <h1>
          TRUE WALK
        </h1>

        <p>
          Create your account
        </p>

      </div>


      <!-- FORM -->

      <form id="registerForm">


        <!-- NAME -->

        <div class="form-group">

          <label for="name">
            Full Name
          </label>

          <div class="input-wrap">

            <span class="input-icon">
              👤
            </span>

            <input
              type="text"
              id="name"
              placeholder="Enter your full name"
              autocomplete="name"
              required
            >

          </div>

        </div>


        <!-- PHONE -->

        <div class="form-group">

          <label for="phone">
            Mobile Number
          </label>

          <div class="input-wrap">

            <span class="input-icon">
              📱
            </span>

            <input
              type="tel"
              id="phone"
              placeholder="Enter 10-digit mobile number"
              maxlength="10"
              inputmode="numeric"
              autocomplete="tel"
              required
            >

          </div>

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="input-wrap">

            <span class="input-icon">
              🔒
            </span>

            <input
              type="password"
              id="password"
              placeholder="Minimum 6 characters"
              autocomplete="new-password"
              required
            >

          </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <div class="input-wrap">

            <span class="input-icon">
              🔐
            </span>

            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm your password"
              autocomplete="new-password"
              required
            >

          </div>

        </div>


        <!-- REFERRAL -->

        <div class="form-group">

          <label for="referralCode">
            Referral Code
            <span style="color:#666;">
              (Optional)
            </span>
          </label>

          <div class="input-wrap">

            <span class="input-icon">
              🔗
            </span>

            <input
              type="text"
              id="referralCode"
              placeholder="Enter referral code"
              maxlength="30"
              autocomplete="off"
            >

          </div>

        </div>


        <!-- REGISTER -->

        <button
          type="submit"
          class="register-btn"
          id="registerBtn"
        >
          REGISTER
        </button>


        <!-- MESSAGE -->

        <div
          id="message"
          class="message">
        </div>


      </form>


      <!-- LOGIN -->

      <div class="login-text">

        Already have an account?

        <a href="login.html">
          Login
        </a>

      </div>


      <div class="bottom-note">
        TRUE WALK • Account Registration
      </div>


    </div>

  </div>


  <script>

    const referralInput =
      document.getElementById("referralCode");


    // URL se referral code automatically lena

    const urlParams =
      new URLSearchParams(
        window.location.search
      );


    const referralFromUrl =
      urlParams.get("ref");


    if (referralFromUrl) {

      referralInput.value =
        referralFromUrl.toUpperCase();

    }


    const registerForm =
      document.getElementById(
        "registerForm"
      );


    const registerBtn =
      document.getElementById(
        "registerBtn"
      );


    const message =
      document.getElementById(
        "message"
      );


    registerForm.addEventListener(
      "submit",
      async function(e) {

        e.preventDefault();


        const name =
          document.getElementById(
            "name"
          ).value.trim();


        const phone =
          document.getElementById(
            "phone"
          ).value.trim();


        const password =
          document.getElementById(
            "password"
          ).value;


        const confirmPassword =
          document.getElementById(
            "confirmPassword"
          ).value;


        const referralCode =
          referralInput.value
            .trim()
            .toUpperCase();


        message.className =
          "message";


        message.textContent =
          "";


        if (name.length < 2) {

          message.textContent =
            "Please enter your full name.";

          message.className =
            "message error";

          return;

        }


        if (!/^[0-9]{10}$/.test(phone)) {

          message.textContent =
            "Please enter a valid 10-digit mobile number.";

          message.className =
            "message error";

          return;

        }


        if (password.length < 6) {

          message.textContent =
            "Password must be at least 6 characters.";

          message.className =
            "message error";

          return;

        }


        if (password !== confirmPassword) {

          message.textContent =
            "Passwords do not match.";

          message.className =
            "message error";

          return;

        }


        registerBtn.disabled =
          true;


        registerBtn.textContent =
          "REGISTERING...";


        try {

          const response =
            await fetch(
              "/api/register",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                credentials:
                  "include",

                body:
                  JSON.stringify({
                    name: name,
                    phone: phone,
                    password: password,
                    referralCode:
                      referralCode ||
                      null
                  })
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.message ||
              "Registration failed."
            );

          }


          message.textContent =
            "Registration successful! Your referral code is " +
            data.referralCode;


          message.className =
            "message success";


          setTimeout(
            function() {

              window.location.href =
                "login.html";

            },
            1500
          );


        } catch (error) {

          message.textContent =
            error.message ||
            "Unable to connect to server.";


          message.className =
            "message error";


        } finally {

          registerBtn.disabled =
            false;


          registerBtn.textContent =
            "REGISTER";

        }

      }
    );

  </script>

</body>
</html>
