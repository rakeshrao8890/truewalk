<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TRUE WALK - Home</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #05060d;
      --bg-2: #080a16;

      --blue: #35a7ff;
      --blue-2: #176cff;
      --purple: #8b5cf6;
      --pink: #ff4ecd;
      --orange: #ff8a3d;

      --text: #ffffff;
      --muted: #9298ad;

      --glass: rgba(255, 255, 255, 0.055);
      --glass-strong: rgba(255, 255, 255, 0.085);
      --border: rgba(255, 255, 255, 0.09);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 10% 5%,
          rgba(53, 167, 255, 0.16),
          transparent 28%
        ),
        radial-gradient(
          circle at 90% 15%,
          rgba(139, 92, 246, 0.15),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(255, 78, 205, 0.08),
          transparent 35%
        ),
        var(--bg);

      overflow-x: hidden;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }

    .background::before {
      content: "";
      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.018) 1px,
          transparent 1px
        );

      background-size: 55px 55px;

      mask-image: linear-gradient(
        to bottom,
        black,
        transparent 80%
      );
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(75px);
      opacity: 0.38;

      animation:
        floatOrb 11s ease-in-out infinite;
    }

    .orb.one {
      width: 240px;
      height: 240px;

      background: var(--blue);

      top: -110px;
      left: -90px;
    }

    .orb.two {
      width: 210px;
      height: 210px;

      background: var(--purple);

      right: -90px;
      top: 35%;

      animation-delay: -3s;
    }

    .orb.three {
      width: 280px;
      height: 280px;

      background: var(--pink);

      bottom: -150px;
      left: 30%;

      animation-delay: -6s;
    }

    @keyframes floatOrb {
      0%, 100% {
        transform:
          translate3d(0, 0, 0)
          scale(1);
      }

      50% {
        transform:
          translate3d(28px, -35px, 0)
          scale(1.08);
      }
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      position: sticky;
      top: 0;
      z-index: 50;

      height: 72px;
      padding: 0 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background:
        rgba(5, 6, 13, 0.76);

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      border-bottom:
        1px solid rgba(255,255,255,0.07);

      box-shadow:
        0 15px 50px rgba(0,0,0,0.28);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-logo {
      position: relative;

      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          #35a7ff,
          #6b5cff 50%,
          #ff4ecd
        );

      box-shadow:
        0 0 0 1px rgba(255,255,255,0.14),
        0 0 25px rgba(53,167,255,0.32),
        0 0 40px rgba(139,92,246,0.18);

      animation:
        logoGlow 4s ease-in-out infinite;
    }

    .brand-logo img {
      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;

      position: relative;
      z-index: 2;

      border-radius: 12px;
    }

    .brand-logo::after {
      content: "";

      position: absolute;
      inset: 2px;

      border-radius: 12px;

      border:
        1px solid rgba(255,255,255,0.25);

      pointer-events: none;

      z-index: 3;
    }

    @keyframes logoGlow {
      0%, 100% {
        transform: translateY(0);

        box-shadow:
          0 0 0 1px rgba(255,255,255,0.14),
          0 0 22px rgba(53,167,255,0.28);
      }

      50% {
        transform: translateY(-2px);

        box-shadow:
          0 0 0 1px rgba(255,255,255,0.18),
          0 0 34px rgba(139,92,246,0.38);
      }
    }

    .brand-name {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .brand-name span {
      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--purple),
          var(--pink),
          var(--blue)
        );

      background-size: 300% auto;

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      animation:
        gradientMove 5s linear infinite;
    }

    @keyframes gradientMove {
      to {
        background-position: 300% center;
      }
    }

    /* =========================
       LOGOUT
    ========================= */

    .logout-btn {
      position: relative;
      overflow: hidden;

      border:
        1px solid rgba(255,255,255,0.11);

      background:
        rgba(255,255,255,0.055);

      color: #fff;

      padding: 10px 17px;

      border-radius: 13px;

      cursor: pointer;

      font-size: 13px;
      font-weight: 750;

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      transition:
        transform 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease,
        color 0.3s ease;
    }

    .logout-btn::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          110deg,
          transparent 20%,
          rgba(255,255,255,0.22),
          transparent 80%
        );

      transform: translateX(-120%);
      transition: transform 0.6s ease;
    }

    .logout-btn:hover::before {
      transform: translateX(120%);
    }

    .logout-btn:hover {
      transform: translateY(-2px);

      border-color:
        rgba(53,167,255,0.4);

      color: #6fc2ff;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.25),
        0 0 20px rgba(53,167,255,0.08);
    }

    .logout-btn:active {
      transform: scale(0.95);
    }

    /* =========================
       MAIN
    ========================= */

    .container {
      width: min(100% - 30px, 1050px);

      margin: 0 auto;

      padding:
        28px 0 55px;
    }

    /* =========================
       WELCOME
    ========================= */

    .welcome {
      position: relative;
      overflow: hidden;

      padding: 26px;

      margin-bottom: 18px;

      border-radius: 25px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.075),
          rgba(255,255,255,0.025)
        );

      border:
        1px solid var(--border);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 20px 60px rgba(0,0,0,0.28);

      animation:
        fadeUp 0.65s ease both;
    }

    .welcome::before {
      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      right: -100px;
      top: -100px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(53,167,255,0.22),
          transparent 70%
        );

      filter: blur(4px);

      animation:
        welcomeGlow 5s ease-in-out infinite;
    }

    .welcome::after {
      content: "";

      position: absolute;

      width: 120px;
      height: 120px;

      left: 40%;
      bottom: -100px;

      border-radius: 50%;

      background:
        rgba(139,92,246,0.14);

      filter: blur(35px);
    }

    @keyframes welcomeGlow {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.25);
      }
    }

    .welcome h1 {
      position: relative;
      z-index: 2;

      font-size: 28px;
      line-height: 1.25;

      margin-bottom: 10px;

      letter-spacing: -0.6px;
    }

    .welcome h1 span {
      background:
        linear-gradient(
          90deg,
          #54b8ff,
          #9b78ff,
          #ff65d7
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      background-size: 200% auto;

      animation:
        gradientMove 4s linear infinite;
    }

    .welcome p {
      position: relative;
      z-index: 2;

      color: var(--muted);

      font-size: 13px;
    }

    .welcome p span {
      color: #e9edff;

      font-weight: 700;
    }

    /* =========================
       ERROR
    ========================= */

    .error {
      display: none;

      margin-bottom: 18px;

      padding: 13px 15px;

      color: #ff9d9d;

      background:
        rgba(255,60,80,0.075);

      border:
        1px solid rgba(255,80,100,0.22);

      border-radius: 15px;

      font-size: 13px;

      backdrop-filter: blur(12px);
    }

    /* =========================
       BALANCE CARD
    ========================= */

    .balance-card {
      position: relative;
      overflow: hidden;

      min-height: 205px;

      padding: 29px;

      margin-bottom: 18px;

      border-radius: 27px;

      background:
        radial-gradient(
          circle at 88% 8%,
          rgba(255,255,255,0.24),
          transparent 23%
        ),
        radial-gradient(
          circle at 10% 90%,
          rgba(53,167,255,0.22),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #1559d8,
          #6638d8 48%,
          #d73a9d
        );

      box-shadow:
        0 25px 70px rgba(58,82,255,0.25),
        0 0 50px rgba(139,92,246,0.08);

      animation:
        fadeUp 0.75s ease both,
        balanceGlow 5s ease-in-out infinite;
    }

    @keyframes balanceGlow {
      0%, 100% {
        box-shadow:
          0 25px 65px rgba(58,82,255,0.22);
      }

      50% {
        box-shadow:
          0 30px 85px rgba(139,92,246,0.34);
      }
    }

    .balance-card::before {
      content: "";

      position: absolute;

      width: 280px;
      height: 280px;

      right: -115px;
      top: -120px;

      border-radius: 50%;

      border:
        1px solid rgba(255,255,255,0.25);

      box-shadow:
        0 0 0 28px rgba(255,255,255,0.025),
        0 0 0 58px rgba(255,255,255,0.018);

      animation:
        rotateRing 16s linear infinite;
    }

    .balance-card::after {
      content: "";

      position: absolute;

      width: 150%;
      height: 90px;

      left: -25%;
      bottom: -60px;

      background:
        rgba(255,255,255,0.08);

      transform: rotate(-5deg);

      filter: blur(5px);
    }

    @keyframes rotateRing {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .balance-label {
      position: relative;
      z-index: 3;

      font-size: 12px;

      font-weight: 800;

      letter-spacing: 1px;

      opacity: 0.84;
    }

    .balance {
      position: relative;
      z-index: 3;

      margin-top: 9px;

      font-size:
        clamp(35px, 7vw, 50px);

      font-weight: 950;

      letter-spacing: -1.5px;

      text-shadow:
        0 6px 25px rgba(0,0,0,0.2);

      animation:
        numberIn 0.8s ease both;
    }

    @keyframes numberIn {
      from {
        opacity: 0;
        transform:
          translateY(14px)
          scale(0.97);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }

    .balance-subtitle {
      position: relative;
      z-index: 3;

      margin-top: 9px;

      font-size: 11px;

      opacity: 0.75;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 15px;

      margin-bottom: 29px;
    }

    .stat-card {
      position: relative;
      overflow: hidden;

      padding: 20px;

      border-radius: 21px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.065),
          rgba(255,255,255,0.025)
        );

      border:
        1px solid var(--border);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 12px 38px rgba(0,0,0,0.2);

      transition:
        transform 0.35s ease,
        border-color 0.35s ease,
        box-shadow 0.35s ease;

      animation:
        fadeUp 0.9s ease both;
    }

    .stat-card:nth-child(2) {
      animation-delay: 0.08s;
    }

    .stat-card::before {
      content: "";

      position: absolute;

      width: 130px;
      height: 130px;

      right: -70px;
      top: -70px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(53,167,255,0.15),
          transparent 70%
        );

      transition: transform 0.5s ease;
    }

    .stat-card:hover {
      transform: translateY(-6px);

      border-color:
        rgba(53,167,255,0.3);

      box-shadow:
        0 20px 45px rgba(0,0,0,0.28),
        0 0 25px rgba(53,167,255,0.06);
    }

    .stat-card:hover::before {
      transform: scale(1.4);
    }

    .stat-icon {
      position: relative;

      width: 47px;
      height: 47px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          rgba(53,167,255,0.17),
          rgba(139,92,246,0.10)
        );

      border:
        1px solid rgba(53,167,255,0.16);

      font-size: 21px;

      margin-bottom: 14px;

      box-shadow:
        inset 0 0 20px rgba(255,255,255,0.025);
    }

    .stat-card h4 {
      color: #969bad;

      font-size: 12px;

      font-weight: 650;

      margin-bottom: 7px;
    }

    .stat-card p {
      font-size: 22px;

      font-weight: 900;

      color: #fff;
    }

    /* =========================
       SECTION TITLE
    ========================= */

    .section-title {
      display: flex;
      align-items: center;

      gap: 10px;

      margin:
        0 2px 15px;

      font-size: 18px;

      font-weight: 850;
    }

    .section-title::before {
      content: "";

      width: 4px;
      height: 21px;

      border-radius: 10px;

      background:
        linear-gradient(
          180deg,
          var(--blue),
          var(--purple),
          var(--pink)
        );

      box-shadow:
        0 0 16px rgba(53,167,255,0.55);
    }

    /* =========================
       ACTIONS
    ========================= */

    .actions {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 15px;
    }

    .action {
      position: relative;
      overflow: hidden;

      min-height: 128px;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 9px;

      text-decoration: none;

      color: #fff;

      border-radius: 21px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.065),
          rgba(255,255,255,0.022)
        );

      border:
        1px solid rgba(255,255,255,0.085);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 12px 35px rgba(0,0,0,0.18);

      transition:
        transform 0.35s cubic-bezier(.2,.8,.2,1),
        border-color 0.35s ease,
        background 0.35s ease,
        box-shadow 0.35s ease;

      animation:
        actionIn 0.7s ease both;
    }

    .action:nth-child(1) {
      animation-delay: 0.05s;
    }

    .action:nth-child(2) {
      animation-delay: 0.10s;
    }

    .action:nth-child(3) {
      animation-delay: 0.15s;
    }

    .action:nth-child(4) {
      animation-delay: 0.20s;
    }

    .action:nth-child(5) {
      animation-delay: 0.25s;
    }

    .action:nth-child(6) {
      animation-delay: 0.30s;
    }

    @keyframes actionIn {
      from {
        opacity: 0;
        transform:
          translateY(20px)
          scale(0.97);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }

    .action::before {
      content: "";

      position: absolute;

      inset: -50%;

      background:
        radial-gradient(
          circle at 50% 70%,
          rgba(53,167,255,0.17),
          transparent 38%
        );

      opacity: 0;

      transition:
        opacity 0.35s ease,
        transform 0.5s ease;

      transform: scale(0.7);
    }

    .action::after {
      content: "";

      position: absolute;

      top: 0;
      left: -120%;

      width: 70%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.08),
          transparent
        );

      transform: skewX(-20deg);

      transition:
        left 0.7s ease;
    }

    .action:hover {
      transform:
        translateY(-8px)
        scale(1.015);

      border-color:
        rgba(53,167,255,0.32);

      background:
        linear-gradient(
          145deg,
          rgba(53,167,255,0.09),
          rgba(139,92,246,0.045)
        );

      box-shadow:
        0 22px 50px rgba(0,0,0,0.3),
        0 0 30px rgba(53,167,255,0.08);
    }

    .action:hover::before {
      opacity: 1;
      transform: scale(1);
    }

    .action:hover::after {
      left: 140%;
    }

    .action:active {
      transform:
        scale(0.96);
    }

    .action-icon {
      position: relative;
      z-index: 2;

      width: 51px;
      height: 51px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 16px;

      font-size: 23px;

      background:
        rgba(255,255,255,0.055);

      border:
        1px solid rgba(255,255,255,0.09);

      box-shadow:
        inset 0 0 20px rgba(255,255,255,0.02);

      transition:
        transform 0.35s ease,
        background 0.35s ease,
        border-color 0.35s ease,
        box-shadow 0.35s ease;
    }

    .action:hover .action-icon {
      transform:
        translateY(-4px)
        scale(1.08)
        rotate(-2deg);

      background:
        linear-gradient(
          135deg,
          rgba(53,167,255,0.15),
          rgba(139,92,246,0.12)
        );

      border-color:
        rgba(53,167,255,0.25);

      box-shadow:
        0 0 25px rgba(53,167,255,0.12);
    }

    .action-name {
      position: relative;
      z-index: 2;

      font-size: 13px;

      font-weight: 750;

      color: #e3e5ee;
    }

    /* =========================
       ACCENT VARIATIONS
    ========================= */

    .plans:hover {
      border-color:
        rgba(255,190,70,0.38);
    }

    .deposit:hover {
      border-color:
        rgba(50,220,150,0.38);
    }

    .withdraw:hover {
      border-color:
        rgba(255,80,110,0.38);
    }

    .refer:hover {
      border-color:
        rgba(100,150,255,0.42);
    }

    .orders:hover {
      border-color:
        rgba(190,100,255,0.42);
    }

    .profile:hover {
      border-color:
        rgba(60,220,220,0.38);
    }

    /* =========================
       PAGE ANIMATION
    ========================= */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform:
          translateY(20px);
      }

      to {
        opacity: 1;
        transform:
          translateY(0);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .header {
        height: 66px;
        padding: 0 14px;
      }

      .brand-logo {
        width: 37px;
        height: 37px;

        border-radius: 12px;
      }

      .brand-logo img {
        border-radius: 10px;
      }

      .brand-name {
        font-size: 16px;
      }

      .logout-btn {
        padding: 9px 13px;
        font-size: 12px;
      }

      .container {
        width:
          min(100% - 22px, 1050px);

        padding-top: 18px;
      }

      .welcome {
        padding: 21px;
        border-radius: 21px;
      }

      .welcome h1 {
        font-size: 23px;
      }

      .balance-card {
        min-height: 178px;

        padding: 23px;

        border-radius: 23px;
      }

      .balance {
        font-size: 34px;
      }

      .stats {
        gap: 11px;
      }

      .stat-card {
        padding: 16px;
        border-radius: 18px;
      }

      .stat-icon {
        width: 42px;
        height: 42px;

        border-radius: 13px;
      }

      .stat-card p {
        font-size: 18px;
      }

      .actions {
        grid-template-columns:
          repeat(2, 1fr);

        gap: 11px;
      }

      .action {
        min-height: 113px;
        border-radius: 18px;
      }

      .action-icon {
        width: 45px;
        height: 45px;

        border-radius: 14px;

        font-size: 21px;
      }

      .action-name {
        font-size: 12px;
      }
    }

    @media (max-width: 390px) {

      .brand-name {
        font-size: 15px;
      }

      .logout-btn {
        padding: 8px 11px;
      }

      .welcome h1 {

  <!-- JAVASCRIPT / ORIGINAL API LOGIC -->
  <!-- DO NOT CHANGE -->

  <script>

    function formatMoney(amount) {

      const number =
        Number(amount || 0);

      return "₹" +
        number.toLocaleString("en-IN", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });

    }


    async function loadHome() {

      try {

        const response =
          await fetch("/api/me", {
            credentials: "include",
            cache: "no-store"
          });


        if (!response.ok) {

          window.location.href =
            "login.html";

          return;

        }


        const data =
          await response.json();


        console.log(
          "ME API:",
          data
        );


        if (data.user) {

          document.getElementById(
            "userName"
          ).textContent =
            data.user.name || "User";


          document.getElementById(
            "userPhone"
          ).textContent =
            data.user.phone || "";

        }


        if (
          data.balance !== undefined
        ) {

          document.getElementById(
            "availableBalance"
          ).textContent =
            formatMoney(
              data.balance
            );

        }


        try {

          const walletResponse =
            await fetch("/api/wallet", {
              credentials: "include",
              cache: "no-store"
            });


          if (walletResponse.ok) {

            const walletData =
              await walletResponse.json();


            console.log(
              "WALLET API:",
              walletData
            );


            if (
              walletData.balance !== undefined
            ) {

              document.getElementById(
                "availableBalance"
              ).textContent =
                formatMoney(
                  walletData.balance
                );

            }


            if (
              Array.isArray(
                walletData.transactions
              )
            ) {

              let totalDeposit = 0;

              let totalWithdrawal = 0;


              walletData.transactions.forEach(
                function(transaction) {

                  const amount =
                    Number(
                      transaction.amount || 0
                    );


                  if (
                    transaction.type ===
                    "deposit"
                  ) {

                    totalDeposit +=
                      Math.abs(amount);

                  }


                  if (
                    transaction.type ===
                    "withdrawal"
                  ) {

                    totalWithdrawal +=
                      Math.abs(amount);

                  }

                }
              );


              document.getElementById(
                "totalDeposit"
              ).textContent =
                formatMoney(
                  totalDeposit
                );


              document.getElementById(
                "totalWithdrawal"
              ).textContent =
                formatMoney(
                  totalWithdrawal
                );

            }

          }

        } catch (walletError) {

          console.log(
            "Wallet error:",
            walletError
          );

        }


      } catch (error) {

        console.error(
          "Home error:",
          error
        );


        const errorMessage =
          document.getElementById(
            "errorMessage"
          );


        errorMessage.textContent =
          "Unable to load account information.";


        errorMessage.style.display =
          "block";

      }

    }


    document
      .getElementById("logoutBtn")
      .addEventListener(
        "click",
        async function() {

          try {

            await fetch(
              "/api/logout",
              {
                method: "POST",
                credentials: "include"
              }
            );

          } catch (error) {

            console.log(
              "Logout error:",
              error
            );

          }


          window.location.href =
            "login.html";

        }
      );


    loadHome();

  </script>
